name: CI/CD

# THIS IS THE PRODUCTION HOTFIX BRANCH. It is based on the commit production is running, not on main,
# and it carries one narrow security fix. The only reason this workflow differs from the one that
# shipped with that commit is BUILD PROVENANCE: production is now promoted rather than pushed, and
# promote-prod.yml on main will only promote a digest that carries a Sigstore attestation binding it
# to its source commit. Without the attest step below this branch could build an artifact that
# nothing is allowed to deploy.
#
# So the delta here is deliberately four additions and one deletion, and NOTHING else:
#   + signing permissions on the build job
#   + an id on the push step, so its digest can be read
#   + the attest step
#   + a `none` dispatch target, which is how this branch publishes without deploying
#   - the deploy-prod job and the `prod` dispatch option, which are the old push-to-production path
#   - the deploy-dev job and the `dev` dispatch option, because this tree's migrations stop at V10 and
#     the dev database is at V19, so rolling it there would not start and would take the dev stack down
#
# No application code, no schema and nothing from main comes with it. Verified by tree hash: the
# whole tree excluding .github is bit-identical to the tree before this change.

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Kept for shape only. This branch builds, tests, publishes and signs; it deploys nothing."
        type: choice
        options: [none]
        default: none

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/gua-ra/identity-service

jobs:
  build:
    runs-on: ubuntu-latest
    # Narrower than the workflow default, plus the two the signing step needs. A job-level block
    # REPLACES the default, so contents and packages are restated or checkout and the push break.
    # `id-token: write` mints the OIDC token Sigstore signs with, which is what makes the certificate
    # carry GitHub's own claims about this run rather than anything this file asserts.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew test --no-daemon
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ref
        run: echo "ref=${IMAGE}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A digest we cannot read is a published artifact with no evidence, so refuse it here rather
      # than let it reach the registry unsigned.
      - name: Require a usable digest from the push
        id: digest
        env:
          PUSHED: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$PUSHED" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::build-push-action reported no usable digest ('${PUSHED}')."
            exit 1
          fi
          echo "digest=$PUSHED" >> "$GITHUB_OUTPUT"

      # THE RECORD PROMOTION REQUIRES. Signs a statement, through Sigstore, whose certificate is
      # minted from this run's OIDC token, so the source repository, the workflow file that signed and
      # the commit all come from GitHub rather than from this file. promote-prod.yml checks exactly
      # those certificate fields and refuses a digest that carries no such signature.
      #
      # `subject-name` must resolve to exactly the IMAGE above, because promotion asserts the signed
      # subject name equals it. `subject-digest` is the index digest, which is the same object the
      # sha-<commit> tag resolves to and the same one kubelet reports back, so the signed subject and
      # the deployed bytes are one object rather than a per-architecture child.
      #
      # It stays in a job written inline in THIS file on purpose: the certificate names the workflow
      # file the signing job is defined in, and promotion pins that filename. Factoring it into a
      # called workflow would make every artifact from this branch unpromotable.
      #
      # Pinned to a commit rather than a tag, because this step is what production trusts.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: false

  # There is deliberately no deploy-dev job on this branch either, and no `dev` dispatch target.
  #
  # This branch's tree is the production baseline, which carries migrations V1..V10. The dev database
  # is at V19. Flyway validates on startup and an applied migration it cannot resolve is a failure, so
  # rolling this image onto dev would not start: it would take the dev stack down until someone
  # redeployed it, and the live passkey end-to-end gate runs against exactly that stack.
  #
  # That made `workflow_dispatch --ref hotfix/... -f environment=dev` a one-keystroke outage with no
  # upside, since QA for this fix belongs on a build of the branch it will be promoted from. Removing
  # the job is one deletion beyond the minimum needed for provenance, and it is here because a hazard
  # that can only cause harm is not worth carrying for the sake of a smaller diff.
  #
  # So this workflow now does exactly one thing: build, test, publish and sign. Nothing it can be asked
  # to do deploys anywhere.
  # There is deliberately no deploy-prod job on this branch any more.
  #
  # Production is promoted, not pushed. promote-prod.yml on main takes a source commit, requires its
  # artifact to already exist AND to carry a verifiable build-provenance attestation for that exact
  # commit, resolves the immutable digest and deploys THAT behind the production environment's
  # approval, after printing the rollback baseline for the approver.
  #
  # The job that stood here was reachable from this branch: a push build uses the workflow file of the
  # pushed ref, but `workflow_dispatch --ref hotfix/... -f environment=prod` evaluates THIS copy. So
  # while it existed, this branch carried a route into ns gua-prod that skipped digest pinning,
  # attestation verification, the settled-rollout check and the rollback inspection. Removing it means
  # the only way this hotfix reaches production is the promotion workflow.
  #
  # deploy-dev is kept: rolling the hotfix onto dev for QA is still useful, and it is opt-in only.
