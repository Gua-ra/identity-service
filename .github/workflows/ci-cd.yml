name: CI/CD

# This workflow builds, tests and publishes. It does NOT deploy to production, by design.
#
# Production is a separate, explicit promotion of an artifact that already exists: see
# promote-prod.yml, which takes a source commit, requires its image to have been built and tested
# already, and deploys the immutable digest behind the `production` environment's approval. The old
# model gave every merge to main its own prod deploy job, which meant production was "whatever was
# merged and approved last" rather than something anyone chose, and it left a branch build with no
# legitimate path to production at all.
#
# Paths here, in order of how often they are used:
#   - label a PR `deploy:dev`  -> builds that branch and rolls it onto dev, so a change can
#                                 be tried on the real stack before it is merged. Remove the
#                                 label and re-add it to redeploy after new commits.
#   - merge to main            -> builds, tests, publishes, and deploys dev.
#   - workflow_dispatch        -> `dev` to build and roll dev; `none` to build, test and publish
#                                 an artifact WITHOUT deploying anything, which is how a hotfix or
#                                 feature branch produces something promotable.
#
# Every image this workflow pushes is also signed with a build provenance attestation binding its
# digest to the commit it was built from. That signature is the only thing that makes an artifact
# promotable: promotion verifies it and refuses an image that does not carry one. An image built
# before this step existed has no such record and cannot be promoted; rebuild the commit here first.
on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      environment:
        description: "Where to deploy after building. `none` builds, tests and publishes only."
        type: choice
        options: [none, dev]
        default: none

permissions:
  contents: read
  packages: write
  # So a labelled PR can be told where it landed.
  pull-requests: write

env:
  IMAGE: ghcr.io/gua-ra/identity-service
  # Put this label on a PR to roll that PR's build onto dev. Only people with write
  # access can label, which is what keeps this from being an open door on a public repo.
  DEPLOY_LABEL: deploy:dev

jobs:
  build:
    runs-on: ubuntu-latest
    # Narrower than the workflow default, plus the two the signing step needs. `id-token: write`
    # mints the OIDC token Sigstore signs with, so the certificate carries GitHub's own claims
    # about this run: which repository, which workflow file, which commit. `attestations: write`
    # stores the resulting bundle against the repository. A fork PR is capped to read no matter
    # what is declared here, which is why a fork can never produce a promotable artifact.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      digest: ${{ steps.push.outputs.digest }}
      deploy-to-dev: ${{ steps.gate.outputs.dev }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew test --no-daemon

      - id: gate
        name: Decide whether this PR asked for a dev deploy
        # Same-repo check: a PR from a fork has no access to the registry credentials, so
        # labelling one would fail at the push step rather than deploy anything.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ] \
             && ${{ contains(github.event.pull_request.labels.*.name, 'deploy:dev') }}; then
            echo "dev=true" >> "$GITHUB_OUTPUT"
          else
            echo "dev=false" >> "$GITHUB_OUTPUT"
          fi

      - id: ref
        run: echo "ref=${IMAGE}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # An unlabelled PR stops at "it builds and the tests pass": no image, no deploy.
      - if: github.event_name != 'pull_request' || steps.gate.outputs.dev == 'true'
        uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request' || steps.gate.outputs.dev == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request' || steps.gate.outputs.dev == 'true'
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          # Deploys always use the immutable sha tag. `dev` stays pinned to main so it keeps
          # meaning "what main builds"; a labelled PR gets a pr-N tag for humans to spot.
          tags: |
            type=sha,format=long
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=pr-${{ github.event.number }},enable=${{ github.event_name == 'pull_request' }}
      - if: github.event_name != 'pull_request' || steps.gate.outputs.dev == 'true'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # THE RECORD THAT MAKES PROMOTION POSSIBLE.
      #
      # Without this, the only link from a commit to an image is the tag `sha-<commit>`, and a tag is
      # a pointer someone with package write can move. Promotion would then be trusting whatever that
      # pointer happens to say on the day, which is not provenance.
      #
      # This signs a statement, through Sigstore, whose certificate is minted from this run's OIDC
      # token. The parts promotion relies on are therefore GitHub's claims and not this workflow's:
      # the source repository, the workflow file that signed, and the commit the run was for. A
      # workflow cannot lie about them even if its own steps are compromised, which is exactly why
      # promotion checks those certificate fields rather than the predicate body.
      #
      # `steps.push.outputs.digest` is the index (manifest-list) digest, which is what production is
      # set to and what kubelet reports back, so the signed subject and the deployed bytes are the
      # same object rather than one of its per-architecture children.
      # A digest we cannot read is a promotable artifact with no evidence, so refuse it here rather
      # than let it reach the registry unsigned.
      - name: Require a usable digest from the push
        if: github.event_name != 'pull_request' || steps.gate.outputs.dev == 'true'
        id: digest
        env:
          PUSHED: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$PUSHED" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::build-push-action reported no usable digest ('${PUSHED}')."
            exit 1
          fi
          echo "digest=$PUSHED" >> "$GITHUB_OUTPUT"

      # Pinned to a commit, not a tag. This step is what production trusts, so the one thing it must
      # not do is follow a moving reference: v4.2.2.
      - if: github.event_name != 'pull_request' || steps.gate.outputs.dev == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          # Left off deliberately. The bundle lives with the repository, where the same people who
          # can move a tag cannot reach it; pushing a copy into the registry would add a second,
          # weaker place for a verifier to look.
          push-to-registry: false

  # AUTOMATIC on merge to main. Also fires for a PR labelled `deploy:dev`, and by hand
  # via workflow_dispatch with environment=dev.
  deploy-dev:
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev') ||
      needs.build.outputs.deploy-to-dev == 'true'
    runs-on: [self-hosted, dev]
    environment: dev
    steps:
      - name: Roll out ${{ needs.build.outputs.ref }} to dev
        run: |
          IMG="${{ needs.build.outputs.ref }}"
          # k8s pulls the immutable sha-tagged image from GHCR via the ghcr-pull secret
          # (deployment is imagePullPolicy: IfNotPresent + imagePullSecrets), no docker needed.
          # Use k3s' bundled kubectl as root so PATH + kubeconfig are always correct on the node.
          sudo k3s kubectl -n gua set image deployment/identity-service identity-service="$IMG"
          sudo k3s kubectl -n gua rollout status deployment/identity-service --timeout=180s

      - name: Tell the PR where it went
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Deployed to **dev** (ns \`gua\`): \`${{ needs.build.outputs.ref }}\`\n\nDev keeps running this build until something else is deployed over it. Merging to main returns dev to main's build.`
            })

  # There is deliberately no deploy-prod job here.
  #
  # Production is promoted, not pushed. promote-prod.yml takes a source commit, requires that commit's
  # artifact to already exist, resolves its immutable digest and deploys THAT behind the `production`
  # environment's approval. Keeping a prod deploy on this workflow made production mean "the last thing
  # merged that someone approved", and it gave a branch build no legitimate route at all, because the
  # production environment is `main`-only. Build here; promote there.
