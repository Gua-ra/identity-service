name: CI/CD

# Deploy paths, in order of how often they are used:
#   - label a PR `deploy:dev`  -> builds that branch and rolls it onto dev, so a change can
#                                 be tried on the real stack before it is merged. Remove the
#                                 label and re-add it to redeploy after new commits.
#   - merge to main            -> deploys dev automatically, and stages prod for approval.
#   - workflow_dispatch        -> same thing by hand, for either environment.
on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment for manual deploy"
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  packages: write
  # So a labelled PR can be told where it landed.
  pull-requests: write

env:
  IMAGE: ghcr.io/gua-ra/identity-service
  # Put this label on a PR to roll that PR's build onto dev. Only people with write
  # access can label, which is what keeps this from being an open door on a public repo.
  DEPLOY_LABEL: deploy:dev

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      deploy-to-dev: ${{ steps.gate.outputs.dev }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew test --no-daemon

      - id: gate
        name: Decide whether this PR asked for a dev deploy
        # Same-repo check: a PR from a fork has no access to the registry credentials, so
        # labelling one would fail at the push step rather than deploy anything.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ] \
             && ${{ contains(github.event.pull_request.labels.*.name, 'deploy:dev') }}; then
            echo "dev=true" >> "$GITHUB_OUTPUT"
          else
            echo "dev=false" >> "$GITHUB_OUTPUT"
          fi

      - id: ref
        run: echo "ref=${IMAGE}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # An unlabelled PR stops at "it builds and the tests pass": no image, no deploy.
      - if: github.event_name != 'pull_request' || steps.gate.outputs.dev == 'true'
        uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request' || steps.gate.outputs.dev == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request' || steps.gate.outputs.dev == 'true'
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          # Deploys always use the immutable sha tag. `dev` stays pinned to main so it keeps
          # meaning "what main builds"; a labelled PR gets a pr-N tag for humans to spot.
          tags: |
            type=sha,format=long
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=pr-${{ github.event.number }},enable=${{ github.event_name == 'pull_request' }}
      - if: github.event_name != 'pull_request' || steps.gate.outputs.dev == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # AUTOMATIC on merge to main. Also fires for a PR labelled `deploy:dev`, and by hand
  # via workflow_dispatch with environment=dev.
  deploy-dev:
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev') ||
      needs.build.outputs.deploy-to-dev == 'true'
    runs-on: [self-hosted, dev]
    environment: dev
    steps:
      - name: Roll out ${{ needs.build.outputs.ref }} to dev
        run: |
          IMG="${{ needs.build.outputs.ref }}"
          # k8s pulls the immutable sha-tagged image from GHCR via the ghcr-pull secret
          # (deployment is imagePullPolicy: IfNotPresent + imagePullSecrets), no docker needed.
          # Use k3s' bundled kubectl as root so PATH + kubeconfig are always correct on the node.
          sudo k3s kubectl -n gua set image deployment/identity-service identity-service="$IMG"
          sudo k3s kubectl -n gua rollout status deployment/identity-service --timeout=180s

      - name: Tell the PR where it went
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Deployed to **dev** (ns \`gua\`): \`${{ needs.build.outputs.ref }}\`\n\nDev keeps running this build until something else is deployed over it. Merging to main returns dev to main's build.`
            })

  # APPROVAL GATE: fires on every merge to main and on workflow_dispatch with
  # environment=prod. A merge deploys dev automatically (deploy-dev above) and also
  # stages this prod deployment, which pauses until a maintainer approves the
  # `production` GitHub Environment (required reviewer).
  #
  # NOTE: this job targets ns gua-prod. It used to say `-n gua`, which meant an approved
  # prod deploy silently re-rolled DEV and prod never received the build. That is why prod
  # still runs the mutable `:dev` tag: it has never had a real deploy. The first successful
  # run here pins it to an immutable sha.
  #
  # It also waits for a runner labelled `prod`, which this repo does not have yet (the only
  # registered runner is labelled `dev`). Until one is registered the job queues rather than
  # deploying, which is the safe failure: it can no longer quietly hit the wrong namespace.
  deploy-prod:
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')
    runs-on: [self-hosted, prod]
    environment: production
    steps:
      - name: Roll out ${{ needs.build.outputs.ref }} to prod
        run: |
          IMG="${{ needs.build.outputs.ref }}"
          sudo k3s kubectl -n gua-prod set image deployment/identity-service identity-service="$IMG"
          sudo k3s kubectl -n gua-prod rollout status deployment/identity-service --timeout=180s
