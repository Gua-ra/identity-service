name: CI/CD

# Builds, tests and publishes signed images; deploys dev only. Production is promoted by promote-prod.yml.
#
# Triggers:
#   - PR labelled `deploy:dev`  -> build that branch and roll it onto dev. Remove and re-add the label to
#                                  redeploy after new commits.
#   - merge to main             -> build, test, publish, deploy dev.
#   - workflow_dispatch         -> `dev` builds and rolls dev; `none` builds, tests and publishes without
#                                  deploying, which is how a branch produces a promotable artifact.
#
# Every pushed image carries a build provenance attestation binding its digest to the commit it was built
# from. Promotion verifies it and refuses an image without one.

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      environment:
        description: "Where to deploy after building. `none` builds, tests and publishes only."
        type: choice
        options: [none, dev]
        default: none

permissions:
  contents: read
  packages: write
  # So a labelled PR can be told where it landed.
  pull-requests: write

env:
  IMAGE: ghcr.io/gua-ra/identity-service
  # Label a PR with this to roll its build onto dev. Only people with write access can label a PR.
  DEPLOY_LABEL: deploy:dev

jobs:
  build:
    runs-on: ubuntu-latest
    # id-token mints the OIDC token Sigstore signs with; attestations stores the bundle.
    # A fork PR is capped to read regardless.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      digest: ${{ steps.push.outputs.digest }}
      deploy-to-dev: ${{ steps.gate.outputs.dev }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew test --no-daemon

      - id: gate
        name: Decide whether this PR asked for a dev deploy
        # A fork PR has no registry credentials, so only same-repo PRs deploy.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ] \
             && ${{ contains(github.event.pull_request.labels.*.name, 'deploy:dev') }}; then
            echo "dev=true" >> "$GITHUB_OUTPUT"
          else
            echo "dev=false" >> "$GITHUB_OUTPUT"
          fi

      - id: ref
        run: echo "ref=${IMAGE}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # An unlabelled PR stops at "it builds and the tests pass": no image, no deploy.
      - if: github.event_name != 'pull_request' || steps.gate.outputs.dev == 'true'
        uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request' || steps.gate.outputs.dev == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request' || steps.gate.outputs.dev == 'true'
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          # Deploys use the immutable sha tag. The dev tag stays pinned to main; a labelled PR gets a pr-N tag.
          tags: |
            type=sha,format=long
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=pr-${{ github.event.number }},enable=${{ github.event_name == 'pull_request' }}
      - if: github.event_name != 'pull_request' || steps.gate.outputs.dev == 'true'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the index (manifest-list) digest: it is what production is set to and what promotion verifies.
      # An unreadable digest would leave a published image unsigned, so the guard below fails closed.
      - name: Require a usable digest from the push
        if: github.event_name != 'pull_request' || steps.gate.outputs.dev == 'true'
        id: digest
        env:
          PUSHED: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$PUSHED" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::build-push-action reported no usable digest ('${PUSHED}')."
            exit 1
          fi
          echo "digest=$PUSHED" >> "$GITHUB_OUTPUT"

      # Pinned to a commit, not a tag: production trusts this step.
      - if: github.event_name != 'pull_request' || steps.gate.outputs.dev == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          # Deliberately off: the bundle stays with the repository, not the registry.
          push-to-registry: false

  # Runs on merge to main, for a PR labelled `deploy:dev`, and by hand via workflow_dispatch with environment=dev.
  deploy-dev:
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev') ||
      needs.build.outputs.deploy-to-dev == 'true'
    runs-on: [self-hosted, dev]
    environment: dev
    steps:
      - name: Roll out ${{ needs.build.outputs.ref }} to dev
        run: |
          IMG="${{ needs.build.outputs.ref }}"
          # k8s pulls the immutable sha-tagged image from GHCR via the ghcr-pull secret, so no docker is needed.
          # k3s' bundled kubectl as root, so PATH and kubeconfig are correct on the node.
          sudo k3s kubectl -n gua set image deployment/identity-service identity-service="$IMG"
          sudo k3s kubectl -n gua rollout status deployment/identity-service --timeout=180s

      - name: Tell the PR where it went
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Deployed to **dev** (ns \`gua\`): \`${{ needs.build.outputs.ref }}\`\n\nDev keeps running this build until something else is deployed over it. Merging to main returns dev to main's build.`
            })

  # No deploy-prod job by design: production is promoted from an existing artifact by promote-prod.yml.
